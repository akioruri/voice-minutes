[package]
name = "voice-minutes"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
base64 = "0.23"
thiserror = "2"
anyhow = "1"
dirs = "7"
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "fs",
    "time",
] }
futures = "0.3"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "fs",
    "time",
] }
