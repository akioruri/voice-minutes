name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ARTIFACT: voice-minutes-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked

          mkdir -p dist
          cp target/release/voice-minutes.exe "dist/$ARTIFACT"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/${{ env.ARTIFACT }}
            dist/${{ env.ARTIFACT }}.sha256

  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ARTIFACT: voice-minutes-macos-arm64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          set -euo pipefail
          cargo build --release --locked

          out="target/release"
          strip "$out/voice-minutes"
          codesign --force --sign - "$out/voice-minutes"

          mkdir -p dist
          tar -czf "dist/$ARTIFACT" -C "$out" voice-minutes

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/${{ env.ARTIFACT }}
            dist/${{ env.ARTIFACT }}.sha256
